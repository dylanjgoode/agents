name: Slack bot unit tests

on:
  pull_request:
    paths:
      - "atlas-explorer/slack-bot/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"
  push:
    branches:
      - main
    paths:
      - "atlas-explorer/slack-bot/**"
      - ".github/workflows/unit-tests.yml"
      - ".github/workflows/unit-tests-slack-bot.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      working-directory: atlas-explorer/slack-bot
