name: Unit tests

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      cache-mongodb-binaries:
        required: false
        type: boolean
        default: false
      private-git-deps:
        required: false
        type: boolean
        default: false
    secrets:
      MAGENTA_GITHUB_TOKEN:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_ENABLE_STRICT: "0"
      NPM_CONFIG_PACKAGE_MANAGER_STRICT: "false"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Allow git to fetch internal GitHub dependencies
        if: inputs.private-git-deps
        env:
          TOKEN: ${{ secrets.MAGENTA_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set repository secret MAGENTA_GITHUB_TOKEN to a PAT with read access to 10gen/magenta-client-libraries. github.token cannot clone that repository because it lives in a different GitHub org."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/cache@v6
        if: inputs.cache-mongodb-binaries
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: |
            mongodb-memory-server-${{ runner.os }}-

      - name: Install dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
