# Human-readable app slug used by Agentic Platform tooling.
# `agentic create` should rewrite this when generating a new app from the template.
name: atlas-explorer
# Node entry point for the Magenta SDK App instance.
# Format: <module path>:<export name>. This template exposes `app` from
# src/agent_atlas_explorer/main.ts (compiled to dist/agent_atlas_explorer/main.js).
entrypoint: agent_atlas_explorer.main:app
framework: langgraph
# Programming language for this agent.
language: typescript
# Optional LLM hints. Application code still constructs the provider client and
# reads the matching API key from .env. Supported: anthropic, gemini, openai, cerebras.
# `agentic create` rewrites provider/model to match your --llm choice.
config:
    provider: openai
    model: gpt-5.4-mini
# Runtime feature flags controlled by agent.yaml, not .env.
#   memory:     long-term memory (semantic/episodic/taxonomic). VOYAGE_API_KEY must be in .env.
#               `agentic create --memory` enables this and prompts for the Voyage key.
#   deep_agent: registers the Tool Pod's built-in filesystem + shell handlers that
#               deep agents rely on. Required for App.deepAgent().
features:
    memory: false
    deep_agent: true
# Declare which secrets each workload may access. Entries are secret NAMES
# (e.g. OPENAI_API_KEY), never secret values - values go in .env locally, or
# in the platform secret store (`agentic secret set`) for deployed agents.
# MONGODB_URI is injected into every workload and need not be listed.
# VOYAGE_API_KEY is a project secret you set once (`agentic secret set
# VOYAGE_API_KEY`) when features.memory is true - it is not listed here either.
# invoke_llm is a reserved tool name: the platform runs model calls in a tool
# pod, so the LLM provider key must also be declared under tools.invoke_llm.
required_secrets:
    aer:
        - OPENAI_API_KEY
    tools:
        invoke_llm:
            - OPENAI_API_KEY
version: 0.1.0
