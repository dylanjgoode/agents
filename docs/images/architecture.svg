<svg xmlns="http://www.w3.org/2000/svg" width="930" height="360" viewBox="0 0 930 360" role="img" aria-labelledby="title desc">
  <title id="title">MongoDB Agents high-level architecture</title>
  <desc id="desc">Left to right: agent templates from the mongodb/agents repository, your settings (an Atlas credential whose roles set the scope, a model provider, and secrets and allowed hosts declared in agent.yaml), the agentengine CLI, and the Atlas Agent Engine runtime (sandboxing and egress, secrets, tracing, durable state). The runtime connects two ways to Atlas, where the MCP server and Performance Advisor live, and to the user surfaces: Playground, CLI, and an example Slack bot.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; fill: #001E2B; }
    .stage { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #5C6C75; }
    .title { font-size: 13px; font-weight: 600; }
    .item { font-size: 12.5px; }
    .sub { font-size: 11px; fill: #00684A; }
    .code { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .engine-title { font-size: 14px; font-weight: 600; fill: #00ED64; }
    .engine-item { font-size: 12.5px; fill: #E3FCF7; }
    .panel { fill: #E3FCF7; stroke: #00684A; stroke-width: 0.75; }
    .card { fill: #FFFFFF; stroke: #00684A; stroke-width: 0.75; }
    .engine-card { fill: #023430; stroke: #00ED64; stroke-width: 0.75; stroke-opacity: 0.7; }
    .link { stroke: #00684A; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#00684A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M8 1L2 5L8 9" fill="none" stroke="#00684A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background keeps the diagram readable in dark mode -->
  <rect x="0" y="0" width="930" height="360" rx="12" fill="#FFFFFF"/>

  <!-- Stage labels -->
  <text class="stage" x="90" y="36">SOURCE</text>
  <text class="stage" x="281" y="36">CONFIGURE</text>
  <text class="stage" x="457" y="36">DEPLOY</text>
  <text class="stage" x="628" y="36">RUN</text>
  <text class="stage" x="827" y="36">CONNECT</text>

  <!-- Source -->
  <rect class="panel" x="20" y="115" width="140" height="170" rx="10"/>
  <text class="title" x="90" y="137">mongodb/agents</text>
  <text class="sub" x="90" y="155">Open templates</text>
  <rect class="card" x="30" y="170" width="120" height="46" rx="6"/>
  <text class="item" x="90" y="185">Atlas</text>
  <text class="item" x="90" y="201">Explorer</text>
  <rect class="card" x="30" y="224" width="120" height="46" rx="6"/>
  <text class="item" x="90" y="239">Atlas Query</text>
  <text class="item" x="90" y="255">Insights</text>

  <!-- Configure -->
  <rect class="panel" x="186" y="64" width="190" height="272" rx="10"/>
  <text class="title" x="281" y="88">Your settings</text>
  <rect class="card" x="196" y="106" width="170" height="64" rx="6"/>
  <text class="item" x="281" y="128">Atlas credential</text>
  <text class="sub" x="281" y="148">Its roles set the scope</text>
  <rect class="card" x="196" y="180" width="170" height="64" rx="6"/>
  <text class="item" x="281" y="202">Model provider</text>
  <text class="sub" x="281" y="222">OpenAI, Anthropic, and more</text>
  <rect class="card" x="196" y="254" width="170" height="64" rx="6"/>
  <text class="item" x="281" y="276">Secrets and hosts</text>
  <text class="sub" x="281" y="296">Declared in agent.yaml</text>

  <!-- Deploy -->
  <rect x="402" y="168" width="110" height="64" rx="10" fill="#00ED64" stroke="#00684A" stroke-width="0.75"/>
  <text class="item code" x="457" y="190" style="font-weight:600">agentengine</text>
  <text class="item" x="457" y="210" style="font-weight:600">CLI</text>

  <!-- Run -->
  <rect x="538" y="64" width="180" height="272" rx="12" fill="#001E2B" stroke="#00684A" stroke-width="0.75"/>
  <text class="engine-title" x="628" y="88">Atlas Agent Engine</text>
  <rect class="engine-card" x="550" y="110" width="156" height="44" rx="6"/>
  <text class="engine-item" x="628" y="132">Sandboxing and egress</text>
  <rect class="engine-card" x="550" y="164" width="156" height="44" rx="6"/>
  <text class="engine-item" x="628" y="186">Secrets</text>
  <rect class="engine-card" x="550" y="218" width="156" height="44" rx="6"/>
  <text class="engine-item" x="628" y="240">Tracing</text>
  <rect class="engine-card" x="550" y="272" width="156" height="44" rx="6"/>
  <text class="engine-item" x="628" y="294">Durable state</text>

  <!-- Connect: Atlas -->
  <rect class="panel" x="744" y="64" width="166" height="132" rx="10"/>
  <text class="title" x="827" y="86">Atlas</text>
  <rect class="card" x="754" y="102" width="146" height="36" rx="6"/>
  <text class="item" x="827" y="120">MCP server</text>
  <rect class="card" x="754" y="146" width="146" height="36" rx="6"/>
  <text class="item" x="827" y="164">Performance Advisor</text>

  <!-- Connect: user surfaces -->
  <rect x="744" y="208" width="166" height="128" rx="10" fill="#FFFFFF" stroke="#00684A" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text class="title" x="827" y="226">User surfaces</text>
  <rect class="panel" x="754" y="240" width="146" height="26" rx="6"/>
  <text class="item" x="827" y="253">Playground</text>
  <rect class="panel" x="754" y="272" width="146" height="26" rx="6"/>
  <text class="item" x="827" y="285">CLI</text>
  <rect class="panel" x="754" y="304" width="146" height="26" rx="6"/>
  <text class="item" x="827" y="317">Slack (example)</text>

  <!-- Connectors -->
  <line class="link" x1="162" y1="200" x2="183" y2="200" marker-end="url(#arrow-end)"/>
  <line class="link" x1="378" y1="200" x2="399" y2="200" marker-end="url(#arrow-end)"/>
  <line class="link" x1="514" y1="200" x2="535" y2="200" marker-end="url(#arrow-end)"/>
  <line class="link" x1="721" y1="130" x2="741" y2="130" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line class="link" x1="721" y1="272" x2="741" y2="272" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
</svg>
